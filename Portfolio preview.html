<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><title>N K Bhaskar Rao – AI &amp; ML Engineering Student</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>:root{
  --bg:#0B1120;--surface:#111b3a;--surface-2:#172554;--line:#21336b;
  --text:#F8FAFC;--muted:#a5b4d4;--accent:#2563EB;--sky:#38BDF8;
  --display:'Plus Jakarta Sans','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.7 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60rem 38rem at 85% -10%,rgba(37,99,235,.30),transparent 60%),radial-gradient(46rem 34rem at -10% 45%,rgba(37,99,235,.16),transparent 60%),radial-gradient(40rem 30rem at 60% 110%,rgba(56,189,248,.10),transparent 60%)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--sky);outline-offset:3px;border-radius:6px}
.wrap{width:min(1120px,100% - 2.5rem);margin-inline:auto}
section{padding:6.5rem 0}
h1,h2,h3{margin:0;font-weight:700}
h2{font:700 clamp(1.7rem,3.5vw,2.4rem)/1.15 var(--display);letter-spacing:-.03em;margin-bottom:.7rem}
.lead{color:var(--muted);max-width:60ch;margin:0 0 3rem}

/* nav */
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
nav.solid{background:rgba(11,17,32,.82);backdrop-filter:blur(14px);border-color:var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font:700 1.1rem var(--display);letter-spacing:-.02em}
.links{display:flex;gap:.25rem;align-items:center}
.links a{padding:.45rem .8rem;border-radius:99px;color:var(--muted);font-size:.95rem;font-weight:500;transition:color .2s,background .2s}
.links a:hover,.links a.on{color:var(--text)}
@media(max-width:860px){.links a{padding:.45rem .65rem}}
@media(max-width:700px){
  html{scroll-padding-top:calc(104px + env(safe-area-inset-top,0px))}
  .nav-in{flex-direction:column;justify-content:center;height:auto;gap:.1rem;padding:.55rem 0 .35rem}
  .links{width:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .links::-webkit-scrollbar{display:none}
  .links a{white-space:nowrap;flex:none}
}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.55rem;padding:.8rem 1.4rem;border-radius:99px;font-weight:600;font-size:.98rem;border:1px solid var(--line);transition:transform .25s var(--ease),background .25s,border-color .25s,box-shadow .25s;cursor:pointer;font-family:inherit;color:var(--text);background:transparent}
.btn:hover{transform:translateY(-2px);border-color:var(--sky)}
.btn.primary{background:linear-gradient(135deg,#1d4ed8,#2563EB 55%,#3b82f6);color:#fff;border-color:transparent;box-shadow:0 8px 24px -10px rgba(37,99,235,.8)}
.btn.primary:hover{box-shadow:0 10px 30px -8px rgba(56,189,248,.6)}
.btn svg,.ic{width:18px;height:18px;flex:none}

/* hero */
.hero{min-height:100svh;display:flex;align-items:center;padding:7.5rem 0 4rem}
.hero-grid{display:grid;grid-template-columns:1fr}
.status{display:inline-flex;align-items:center;gap:.65rem;padding:.55rem 1.1rem;margin-bottom:1.6rem;border:1px solid var(--line);border-radius:99px;background:rgba(17,27,58,.6);color:var(--sky);font-size:.95rem}
.dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 2.2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.hero h1{font:400 1rem/1.05 var(--display);margin:0 0 1.4rem}
.hero .hi{display:block;font:400 clamp(1.4rem,3.3vw,2.4rem)/1.15 var(--display);letter-spacing:-.02em;color:var(--muted);margin-bottom:.1em}
.hero .name{display:block;font:800 clamp(1.8rem,5.2vw,3.8rem)/1.05 var(--display);letter-spacing:-.045em;padding-bottom:.08em;background:linear-gradient(95deg,#3b82f6,#60a5fa 45%,#38BDF8);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.hero .role{font:600 clamp(.95rem,1.9vw,1.35rem)/1.3 var(--sans);color:var(--sky);margin:0 0 1.4rem;max-width:none}
.hero p{color:var(--muted);max-width:52ch;margin:0 0 2rem}
.hero .btn.primary{border-color:transparent}
.hero .btn.primary:hover{box-shadow:0 10px 30px -8px rgba(37,99,235,.6)}
.hero .btn:not(.primary){border-color:rgba(56,189,248,.55)}
.hero .btn:not(.primary):hover{border-color:#38BDF8}
.cta{display:flex;gap:.8rem;flex-wrap:wrap}
.rise{opacity:0;transform:translateY(18px);animation:rise .9s var(--ease) forwards}
@keyframes rise{to{opacity:1;transform:none}}
@media(max-width:900px){.hero{padding-top:6.5rem}}
@media(max-width:700px){.hero{padding-top:8rem}}

/* reveal */
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:none}
/* about */
.about{max-width:760px}
.about p{color:var(--muted);margin:0 0 1.1rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.4rem}
.chip{padding:.35rem .85rem;border-radius:99px;border:1px solid var(--line);font-size:.88rem;color:var(--muted);transition:border-color .25s,color .25s}
.chip:hover{border-color:var(--accent);color:var(--text)}
/* skills */
.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin-top:2.2rem}
.sk{display:flex;flex-direction:column;gap:1.1rem;padding:1.4rem 1.5rem;background:var(--surface);border:1px solid var(--line);border-radius:18px;transition:opacity .8s var(--ease),transform .45s var(--ease),border-color .3s,background .3s,box-shadow .45s var(--ease)}
.sk:hover{transform:translateY(-3px);border-color:rgba(56,189,248,.5);background:var(--surface-2);box-shadow:0 18px 36px -22px rgba(37,99,235,.7)}
.sk-top{display:flex;align-items:center;gap:1rem}
.sk-ic{display:grid;place-items:center;width:46px;height:46px;flex:none;border-radius:12px;color:var(--sky);background:linear-gradient(135deg,rgba(37,99,235,.35),rgba(56,189,248,.12));border:1px solid rgba(56,189,248,.28);transition:transform .35s var(--ease)}
.sk-ic .ic{width:22px;height:22px}
.sk:hover .sk-ic{transform:scale(1.08) rotate(-4deg)}
.sk-name{font:700 1.15rem/1.3 var(--display);letter-spacing:-.01em}
.sk-lvl{margin-left:auto;color:var(--sky);font-weight:500;white-space:nowrap}
.bar{height:8px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--sky));transition:width 1.4s var(--ease)}
.in .bar i{width:var(--w)}
@media(max-width:700px){.skills{grid-template-columns:1fr}}

/* projects */
.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:1.3rem}
.card{position:relative;display:flex;flex-direction:column;padding:1.7rem;background:var(--surface);border:1px solid var(--line);border-radius:20px;transition:transform .45s var(--ease),opacity .8s var(--ease),border-color .3s,background .3s,box-shadow .45s var(--ease)}
.card:hover{transform:translateY(-6px);border-color:rgba(56,189,248,.55);background:var(--surface-2);box-shadow:0 22px 44px -22px rgba(37,99,235,.6)}
.card h3{font:700 1.3rem/1.25 var(--display);letter-spacing:-.02em;margin:.2rem 0 .6rem}
.card p{color:var(--muted);margin:0 0 1.2rem;font-size:.98rem;flex:1}
.card .chips{margin:0 0 1.3rem}.card .chip{font-size:.8rem;padding:.2rem .7rem}
.gh{display:inline-flex;align-items:center;gap:.5rem;font-weight:600;font-size:.95rem;color:var(--sky)}
.gh svg{transition:transform .3s var(--ease)}.card:hover .gh svg{transform:translateX(4px)}
.metric{font-size:.88rem;color:var(--sky);font-weight:600}
/* education */
.edu{display:grid;gap:1.4rem;max-width:920px}
.edu-row{display:grid;grid-template-columns:130px 30px 1fr;align-items:stretch}
.edu-when{padding-top:1.7rem;text-align:right;padding-right:.5rem;font-weight:600;font-size:.95rem;line-height:1.7;color:var(--sky);font-variant-numeric:tabular-nums;white-space:nowrap}
.edu-when-m{display:none;margin-bottom:.4rem;font-weight:600;font-size:.85rem;color:var(--sky)}
.edu-rail{position:relative}
.edu-rail::before{content:"";position:absolute;left:50%;top:calc(2.5rem - 5.5px);width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--bg);border:2px solid var(--accent);z-index:1;transition:transform .3s var(--ease),box-shadow .3s}
.edu-rail::after{content:"";position:absolute;left:50%;top:calc(2.5rem + 6px);bottom:calc(-1.4rem - 2.5rem);width:1px;margin-left:-.5px;background:linear-gradient(var(--line),var(--line))}
.edu-row:last-child .edu-rail::after{display:none}
.edu-row.now .edu-rail::before{background:var(--accent);box-shadow:0 0 0 6px rgba(37,99,235,.25)}
.edu-row:hover .edu-rail::before{transform:scale(1.35)}
.edu-card{gap:0}
.edu-card h3{margin:0;font-size:1.25rem}
.edu-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.8rem 1rem;flex-wrap:wrap}
.badge-now{display:inline-flex;align-items:center;gap:.5rem;padding:.25rem .75rem;border-radius:99px;font-size:.78rem;font-weight:600;color:var(--sky);background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.3);white-space:nowrap}
.badge-now i{width:6px;height:6px;border-radius:50%;background:var(--sky);animation:ping 2.2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(56,189,248,.6)}70%,100%{box-shadow:0 0 0 7px rgba(56,189,248,0)}}
.edu-school{display:flex;align-items:center;flex-wrap:wrap;gap:.45rem;margin:.55rem 0 1.1rem;color:var(--muted);font-size:.98rem}
.edu-school b{color:var(--text);font-weight:600}
.edu-school .ic{width:16px;height:16px;color:var(--sky)}
.edu-school .sep{opacity:.5;margin:0 .1rem}
.edu-meta{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.grade{padding:.3rem .85rem;border-radius:10px;font-weight:700;font-size:.9rem;color:var(--text);background:linear-gradient(135deg,rgba(37,99,235,.38),rgba(56,189,248,.16));border:1px solid rgba(56,189,248,.35)}
@media(max-width:700px){
  .edu-row{grid-template-columns:22px 1fr}
  .edu-when{display:none}.edu-when-m{display:block}
  .edu-rail::before{top:calc(1.7rem + .7rem - 5.5px)}
  .edu-rail::after{top:calc(1.7rem + .7rem + 6px)}
}
/* certifications */
.ach{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:1.2rem;margin-top:2.2rem;max-width:780px}
.cert{padding:0;overflow:hidden}
.cert-img{position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;border:0;background:#050a18;overflow:hidden;cursor:zoom-in}
.cert-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease)}
.cert:hover .cert-img img{transform:scale(1.04)}
.cert-zoom{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:1.8rem 1rem .9rem;font:600 .9rem var(--sans);color:#fff;background:linear-gradient(transparent,rgba(5,10,24,.9));opacity:0;transform:translateY(8px);transition:opacity .3s,transform .35s var(--ease)}
.cert-img:hover .cert-zoom,.cert-img:focus-visible .cert-zoom{opacity:1;transform:none}
.cert-body{display:flex;flex-direction:column;gap:.45rem;padding:1.15rem 1.3rem 1.35rem}
.cert-type{display:inline-flex;align-items:center;gap:.5rem;color:var(--sky);font-weight:600;font-size:.85rem}
.cert-type .ic{width:16px;height:16px}
.cert h3{margin:0;font:700 1.08rem/1.3 var(--display);letter-spacing:-.02em}
.cert .cert-by{margin:0;flex:none;color:var(--text);font-size:.9rem;font-weight:500}
.cert .chips{margin:.5rem 0 0}
.cert .gh{align-self:flex-start;margin-top:.6rem}
.lightbox{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:calc(1.5rem + env(safe-area-inset-top,0px)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom,0px));background:rgba(5,9,20,.9);backdrop-filter:blur(8px);animation:fadeIn .25s ease}
.lightbox img{max-width:min(94vw,1200px);max-height:84vh;border-radius:12px;box-shadow:0 30px 80px -20px rgba(0,0,0,.9);animation:zoomIn .35s var(--ease)}
.lightbox-x{position:absolute;top:calc(1rem + env(safe-area-inset-top,0px));right:1rem;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:1.1rem;cursor:pointer;transition:border-color .25s,transform .25s var(--ease)}
.lightbox-x:hover{border-color:var(--sky);transform:rotate(90deg)}
@keyframes fadeIn{from{opacity:0}}
@keyframes zoomIn{from{opacity:0;transform:scale(.96)}}

/* resume */
.resume{display:flex;justify-content:space-between;align-items:center;gap:2rem;flex-wrap:wrap;padding:2.6rem;border-radius:26px;border:1px solid var(--line);background:linear-gradient(120deg,var(--surface-2),var(--surface) 60%),var(--surface)}
.resume h2{margin-bottom:.4rem}.resume p{margin:0;color:var(--muted);max-width:46ch}
/* contact */
.contact{text-align:center}
.contact h2{font-size:clamp(1.9rem,4vw,2.8rem);line-height:1.08;letter-spacing:-.04em}
.contact .cta{justify-content:center;margin-top:1.8rem}
.cform{max-width:820px;margin:2.2rem auto 0;padding:2.2rem;text-align:left;display:grid;gap:1.3rem;border:1px solid var(--line);border-radius:28px;background:linear-gradient(160deg,rgba(23,37,84,.55),rgba(11,17,32,.7)),var(--surface)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:1.3rem}
.fld{display:grid;gap:.55rem;font-weight:600;font-size:.92rem;color:#b4c0e0}
.fld input,.fld textarea{width:100%;padding:1rem 1.2rem;font:400 1rem var(--sans);color:var(--text);background:rgba(11,17,32,.55);border:1px solid var(--line);border-radius:16px;outline:none;transition:border-color .25s,box-shadow .25s,background .25s}
.fld textarea{resize:vertical;min-height:150px}
.fld input::placeholder,.fld textarea::placeholder{color:#6f7da0;font-weight:400}
.fld input:focus,.fld textarea:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(56,189,248,.18);background:rgba(11,17,32,.8)}
.cform .send{justify-self:start;padding:1rem 2rem;font-size:1.02rem;cursor:pointer}
.cform-err{margin:0;color:#fca5a5;font-size:.92rem}
@media(max-width:700px){.row2{grid-template-columns:1fr}.cform{padding:1.5rem}}
footer{padding:2rem 0 2.5rem;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem;text-align:center}
.proj-links{margin-top:1.2rem}

/* interactions */
.links a{position:relative}
.links a::after{content:"";position:absolute;left:.8rem;right:.8rem;bottom:.2rem;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),#38BDF8);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.links a:hover::after,.links a.on::after{transform:scaleX(1)}
@media(max-width:860px){.links a::after{left:.65rem;right:.65rem}}
.logo{transition:color .25s}
.logo:hover{color:var(--sky)}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s var(--ease)}
.btn:hover::after{transform:translateX(120%)}
.btn:active{transform:translateY(0) scale(.97)}
.btn svg{transition:transform .3s var(--ease)}
.btn:hover svg{transform:translateY(-2px)}
.chip{transition:border-color .25s,color .25s,background .25s,transform .25s var(--ease)}
.chip:hover{transform:translateY(-2px);background:rgba(56,189,248,.12)}
.card::before,.resume::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(56,189,248,.16),transparent 60%)}
.card:hover::before,.resume:hover::before{opacity:1}
.resume{position:relative;transition:opacity .8s var(--ease),transform .8s var(--ease),border-color .3s,box-shadow .45s var(--ease)}
.resume:hover{border-color:rgba(56,189,248,.5);box-shadow:0 26px 60px -30px rgba(37,99,235,.6)}
.progress{position:fixed;top:env(safe-area-inset-top,0px);left:0;width:100%;height:3px;z-index:70;transform:scaleX(0);transform-origin:left;background:linear-gradient(90deg,#2563EB,#38BDF8);pointer-events:none}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}.rv,.rise{opacity:1;transform:none}
  .badge-now i,.dot{animation:none!important}
}

</style></head><body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

// hooks/useInView.js

/** Adds the "in" class the first time the element scrolls into view,
 *  then clears its stagger delay so hover animations respond instantly. */
function useInView() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      ([e]) => {
        if (e.isIntersecting) {
          el.classList.add("in");
          const d = parseFloat(el.style.transitionDelay) || 0;
          setTimeout(() => { el.style.transitionDelay = "0ms"; }, d + 900);
          io.disconnect();
        }
      },
      { threshold: 0.15 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}

// hooks/useSpotlight.js

/** Cursor spotlight on cards: sets --mx / --my, which the CSS uses for the glow. */
function useSpotlight() {
  useEffect(() => {
    const onMove = (e) => {
      const el = e.target.closest && e.target.closest(".card, .resume");
      if (!el) return;
      const r = el.getBoundingClientRect();
      el.style.setProperty("--mx", e.clientX - r.left + "px");
      el.style.setProperty("--my", e.clientY - r.top + "px");
    };
    document.addEventListener("pointermove", onMove, { passive: true });
    return () => document.removeEventListener("pointermove", onMove);
  }, []);
}

// components/Reveal.jsx

/** Wrapper that fades and slides its content in on scroll. */
function Reveal({ as: Tag = "div", className = "", delay = 0, style, children, ...rest }) {
  const ref = useInView();
  return (
    <Tag ref={ref} className={"rv " + className} style={{ transitionDelay: delay + "ms", ...style }} {...rest}>
      {children}
    </Tag>
  );
}

  );
}

// components/Lightbox.jsx

function Lightbox({ cert, onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = prev; };
  }, [onClose]);
  return (
    <div className="lightbox" role="dialog" aria-modal="true" aria-label={cert.title} onClick={onClose}>
      <button className="lightbox-x" aria-label="Close" onClick={onClose}>✕</button>
      <img src={cert.img} alt={cert.type + ": " + cert.title} onClick={(e) => e.stopPropagation()} />
    </div>
  );
}

// components/ScrollProgress.jsx

/** Thin gradient bar at the top that fills as you scroll down the page. */
function ScrollProgress() {
  const ref = useRef(null);
  useEffect(() => {
    let raf = 0;
    const update = () => {
      raf = 0;
      const h = document.documentElement.scrollHeight - window.innerHeight;
      if (ref.current) ref.current.style.transform = `scaleX(${h > 0 ? Math.min(window.scrollY / h, 1) : 0})`;
    };
    const onScroll = () => { if (!raf) raf = requestAnimationFrame(update); };
    update();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return () => {
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
      cancelAnimationFrame(raf);
    };
  }, []);
  return <div className="progress" ref={ref} aria-hidden="true" />;
}

// components/Nav.jsx


function Nav() {
  const [solid, setSolid] = useState(false);
  const [active, setActive] = useState("");
  const linksRef = useRef(null);

  // Scroll-spy: highlight whichever section is under the reading line
  useEffect(() => {
    let raf = 0;
    const update = () => {
      raf = 0;
      setSolid(window.scrollY > 20);
      const line = window.innerHeight * 0.35;
      let current = "";
      NAV.forEach((id) => {
        const el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top <= line) current = id;
      });
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) current = NAV[NAV.length - 1];
      setActive(current);
    };
    const onScroll = () => { if (!raf) raf = requestAnimationFrame(update); };
    update();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return () => {
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
      cancelAnimationFrame(raf);
    };
  }, []);

  // On small screens the link row scrolls sideways: keep the active link centred
  useEffect(() => {
    const box = linksRef.current;
    const link = box && box.querySelector("a.on");
    if (!link) return;
    const b = box.getBoundingClientRect();
    const l = link.getBoundingClientRect();
    box.scrollTo({ left: box.scrollLeft + (l.left - b.left) - (b.width - l.width) / 2, behavior: "smooth" });
  }, [active]);

  return (
    <nav className={solid ? "solid" : ""}>
      <div className="wrap nav-in">
        <a href="#top" className="logo" aria-label="Back to top">{ME.name}</a>
        <div className="links" ref={linksRef}>
          {NAV.map((id) => (
            <a key={id} href={"#" + id} className={active === id ? "on" : ""}>
              {id[0].toUpperCase() + id.slice(1)}
            </a>
          ))}
        </div>
      </div>
    </nav>
  );
}

// components/Contact.jsx




function Contact() {
  const [f, setF] = useState({ name: "", email: "", subject: "", message: "" });
  const [err, setErr] = useState("");
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });

  // No server needed: opens the visitor's email app with everything filled in
  const send = () => {
    if (!f.name.trim() || !f.email.trim() || !f.message.trim()) return setErr("Please fill in your name, email and message.");
    if (!/^\S+@\S+\.\S+$/.test(f.email.trim())) return setErr("Please enter a valid email address.");
    setErr("");
    const subject = f.subject.trim() || "Message from " + f.name.trim();
    const body = f.message.trim() + "\n\n— " + f.name.trim() + " (" + f.email.trim() + ")";
    window.open("https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(ME.email) + "&su=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body), "_blank", "noopener");
  };

  return (
    <section id="contact" className="contact"><div className="wrap">
      <Reveal><h2>Let’s work together.</h2></Reveal>
      <Reveal className="cform" delay={100} role="group" aria-label="Contact form">
        <div className="row2">
          <label className="fld">Your name
            <input type="text" value={f.name} onChange={set("name")} placeholder="Enter your name" autoComplete="name" />
          </label>
          <label className="fld">Your email
            <input type="email" value={f.email} onChange={set("email")} placeholder="Enter your email address" autoComplete="email" />
          </label>
        </div>
        <label className="fld">Subject
          <input type="text" value={f.subject} onChange={set("subject")} placeholder="What would you like to discuss?" />
        </label>
        <label className="fld">Message
          <textarea rows="6" value={f.message} onChange={set("message")} placeholder="Write your message here..." />
        </label>
        {err && <p className="cform-err" role="alert">{err}</p>}
        <button className="btn primary send" onClick={send}>Send Message</button>
      </Reveal>
      <Reveal className="cta" delay={150}>
        <a className="btn" href={"https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(ME.email)} target="_blank" rel="noopener noreferrer">{Icon.mail} Email me</a>
        <a className="btn" href={ME.linkedin} target="_blank" rel="noopener noreferrer">{Icon.in} LinkedIn</a>
        <a className="btn" href={ME.github} target="_blank" rel="noopener noreferrer">{Icon.gh} GitHub</a>
      </Reveal>
    </div></section>
  );
}
